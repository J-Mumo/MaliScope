# MaliScope production stack — Next.js app + Postgres.
#
# Bring up:   docker compose up -d --build      # auto-loads .env
# Tail logs:  docker compose logs -f web
#
# One-shot admin tasks (migrations, discovery job) — the `web` runtime image is
# Next.js standalone output and does NOT contain src/, drizzle-kit, or tsx.
# Use the `jobs` profile, which builds from the Dockerfile's `build` stage:
#   Migrate:  docker compose --profile jobs run --rm jobs npm run db:migrate
#   Discover: docker compose --profile jobs run --rm jobs npm run job:discover
#
# Public ingress: TLS terminates in the shared Caddy proxy stack (~/proxy).
# Caddy reaches this stack via the external `web` network by resolving the
# container name `maliscope-web-1`. Nothing here binds to a public host port.

name: maliscope

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-maliscope}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD must be set}
      POSTGRES_DB: ${PGDATABASE:-maliscope}
    volumes:
      - maliscope-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-maliscope} -d ${PGDATABASE:-maliscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # For local dev, uncomment to expose Postgres on the host:
    # ports:
    #   - "127.0.0.1:5433:5432"

  web:
    build:
      context: .
    image: maliscope-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose the DATABASE_URL from the same vars that .env.example already sets.
      # PGHOST is forced to the internal service name; PGPORT to Postgres default.
      DATABASE_URL: postgresql://${PGUSER:-maliscope}:${PGPASSWORD}@postgres:5432/${PGDATABASE:-maliscope}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - web

  # One-shot admin container: same source as `web`, but stops at the `build`
  # stage of the Dockerfile so it still has src/, drizzle/, and devDependencies
  # (tsx, drizzle-kit). Never started by `docker compose up` because of the
  # `jobs` profile. Invoke explicitly, e.g.:
  #   docker compose --profile jobs run --rm jobs npm run job:discover
  jobs:
    profiles: ["jobs"]
    build:
      context: .
      target: build
    image: maliscope-jobs:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${PGUSER:-maliscope}:${PGPASSWORD}@postgres:5432/${PGDATABASE:-maliscope}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    # No CMD — always invoke via `docker compose run --rm jobs <cmd>`.

volumes:
  maliscope-postgres:

networks:
  default:
  web:
    external: true
